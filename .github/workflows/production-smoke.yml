name: Production commerce sync smoke
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Check live admin and storefront public APIs
        run: |
          python3 - <<'PY'
          import json, time, urllib.request
          admin_url = 'https://studio-commerce-admin.vercel.app/api/store/bootstrap'
          shop_url = 'https://essential-store-design-1.vercel.app/api/catalog'
          def get_json(url):
              req = urllib.request.Request(url, headers={'User-Agent': 'Commerce-Sync-Healthcheck/1.0'})
              with urllib.request.urlopen(req, timeout=16) as response:
                  if response.status != 200:
                      raise RuntimeError(f'HTTP {response.status}: {url}')
                  return json.load(response)
          for attempt in range(30):
              try:
                  admin = get_json(admin_url)
                  shop = get_json(shop_url)
                  if admin.get('mode') != 'live' or shop.get('demo') is not False:
                      raise AssertionError('Shop is not in live sync mode')
                  admin_products = {p['slug']: p for p in admin.get('products', [])}
                  shop_products = {p['slug']: p for p in shop.get('products', [])}
                  if len(admin_products) < 8 or len(shop_products) < 8:
                      raise AssertionError('Seeded product catalog not available')
                  if set(admin_products) != set(shop_products):
                      raise AssertionError('Catalog slugs mismatch')
                  for slug, product in admin_products.items():
                      storefront = shop_products[slug]
                      for k in ('id', 'name', 'price', 'inventory'):
                          if product[k] != storefront[k]:
                              raise AssertionError(f'{slug} {k} not synchronized')
                  # A passing API is not enough: verify the rendered storefront pages as users see them.
                  page_paths = ['/', '/products', '/category/clothing', '/product/minimal-leather-bag', '/cart', '/checkout', '/account', '/info/privacy', '/blog']
                  for path in page_paths:
                      request = urllib.request.Request('https://essential-store-design-1.vercel.app'+path,
                          headers={'User-Agent': 'Commerce-SSR-Healthcheck/1.0'})
                      with urllib.request.urlopen(request, timeout=18) as response:
                          html = response.read(12000).decode('utf-8', 'replace')
                          if response.status != 200 or '<html' not in html:
                              raise AssertionError(f'Invalid storefront page {path}: {response.status}')
                  with urllib.request.urlopen('https://studio-commerce-admin.vercel.app/login', timeout=18) as response:
                      if response.status != 200: raise AssertionError('Admin login failed to render')
                  print(f'PASS: {len(page_paths)} storefront pages and admin login serve HTTP 200')
                  # Verify the live order relay reaches the admin and rejects invalid products.
                  # This request must create no customer, order or payment.
                  import urllib.error
                  order_body = json.dumps({
                      'buyer': {'name': 'تست اتصال', 'phone': '09120000000',
                                'province': 'تهران', 'city': 'تهران', 'address': 'آدرس آزمایشی'},
                      'items': [{'productId': 'nonexistent-ci-product', 'quantity': 1}],
                      'shippingId': 'demo-post'
                  }, ensure_ascii=False).encode('utf-8')
                  order_req = urllib.request.Request(
                      'https://essential-store-design-1.vercel.app/api/store/order',
                      data=order_body, method='POST',
                      headers={'Content-Type': 'application/json',
                               'Origin': 'https://essential-store-design-1.vercel.app'})
                  try:
                      with urllib.request.urlopen(order_req, timeout=20) as response:
                          raise AssertionError(f'Invalid product was accepted: {response.status}')
                  except urllib.error.HTTPError as error:
                      if error.code != 409:
                          raise AssertionError(f'Order relay did not validate product: {error.code}')
                      message = json.loads(error.read().decode('utf-8')).get('error', '')
                      if 'کالا' not in message:
                          raise AssertionError('Server returned generic database failure instead of invalid-product rejection: '+message)
                  print('PASS: invalid order rejected by admin service (409), no order created')
                  print(f'PASS: {len(shop_products)} live products, identical prices/inventory and slug set')
                  break
              except Exception as ex:
                  print(f'Attempt {attempt+1}/30: {type(ex).__name__}: {ex}', flush=True)
                  if attempt == 29: raise
                  time.sleep(6)
          PY