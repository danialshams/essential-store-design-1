name: Edition 01 Integrated Admin QA
on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/edition01-integrated-admin-20261105]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: edition01
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/edition01?schema=public
      NEXT_PUBLIC_STUDIO_DEMO: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx prisma migrate deploy
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - name: Verify isolated real PostgreSQL checkout and CMS publication
        run: node scripts/test-admin-integration.mjs
      - name: Populate isolated CI showroom with real discounted festival products
        env:
          TEMP_PUBLIC_ADMIN_EDIT: "1"
        run: node scripts/seed-festival-demo.mjs
      - name: Browser QA for real responsive administration UI
        env:
          NEXT_PUBLIC_STUDIO_DEMO: "1"
        run: node scripts/test-admin-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: edition01-admin-browser-screenshots
          path: .artifacts/dialogs/*.png
          if-no-files-found: ignore
