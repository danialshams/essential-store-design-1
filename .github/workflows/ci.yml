name: Essential Store Next.js CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Prepare locally served editorial assets
        run: node scripts/prepare-atelier-media.mjs
      - name: Source tests
        run: npm test
      - name: TypeScript
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Cinematic home browser regression
        run: node scripts/test-atelier-browser.mjs
      - name: Upload desktop and mobile review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atelier-visual-review
          path: .artifacts/atelier/*.jpg
          if-no-files-found: ignore
